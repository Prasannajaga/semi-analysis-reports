schemaVersion: "1.0"
DEBUG: true
benchmark:
  name: glm-5-3-flash-agentx
  description: AgentX benchmark for GLM 5.3 Flash across Direct Providers (Fireworks, Together, Baseten)
  seed: 42

gateway:
  type: directProviders
  providers:
    - id: fireworks
      slug: fireworks
      endpoints: https://api.fireworks.ai/inference/v1
      apikeyENV: FIREWORKS_API_KEY
      model: accounts/fireworks/models/glm-5p3-flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03
    - id: together
      slug: together
      endpoints: https://api.together.ai/v1
      apikeyENV: TOGETHER_API_KEY
      model: zai-org/GLM-5.3-Flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03
    - id: baseten
      slug: baseten
      endpoints: https://inference.baseten.co/v1
      apikeyENV: BASETEN_API_KEY
      model: zai-org/GLM-5.3-Flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03

# AIPerf model and tokenizer parameters
models:
  - id: glm-5-3-flash
    openrouterModel: z-ai/glm-5.3-flash
    tokenizer: THUDM/glm-4-9b-chat
    tokenizerTrustRemoteCode: true
    contextLength: 1048576

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: agentx
      dataset:
        name: semianalysis_cc_traces_weka_062126
        maxContextLength: 1048576
        # For 256k context traces:
        # name: semianalysis_cc_traces_weka_062126-256k
        # maxContextLength: 262144
    load:
      mode: concurrency
      values: [1]
    durationSeconds: 900
    warmup:
      requestCount: 1
    useServerTokenCount: true

  pricing:
    enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 180
      maxP95TtftMs: 5000
      minSuccessRate: 0.90
