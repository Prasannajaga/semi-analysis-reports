schemaVersion: "1.0"
benchmark:
  name: glm-5-3-flash-provider-benchmark
  description: Benchmark GLM 5.3 Flash across Fireworks and Together with 1M context
  seed: 42

gateway:
  type: openrouter
  baseUrl: https://openrouter.ai/api/v1
  apiKeyEnv: OPENROUTER_API_KEY
  retries:
    maxRetries: 3
    retryDelaySeconds: 2.0
    backoffFactor: 2.0
  routing:
    allowFallbacks: false
    requireParameters: true

providers:
  - id: fireworks
    openrouterSlug: fireworks
  - id: together
    openrouterSlug: together

models:
  - id: glm-5-3-flash
    openrouterModel: z-ai/glm-5.3-flash
    tokenizer: THUDM/glm-4-9b-chat
    tokenizerTrustRemoteCode: true
    contextLength: 1048575

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: synthetic
      inputTokens: 8192
      outputTokens: 1024
      datasetEntries: 64
    load:
      mode: concurrency
      values: [1]
    durationSeconds: 300
    warmup:
      requestCount: 1
    useServerTokenCount: true

  correctness:
    enabled: false
    generation:
      temperature: 0
      maxTokens: 8192
    tasks:
      - name: gsm8k
        runner: lm-eval

  pricing:
    enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 300
      maxP95TtftMs: 5000
      minSuccessRate: 0.99
