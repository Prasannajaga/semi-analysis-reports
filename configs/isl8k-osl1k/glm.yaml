schemaVersion: "1.0"
DEBUG: true
benchmark:
  name: glm-5-3-flash-isl8k-osl1k
  description: Benchmark GLM 5.3 Flash across Fireworks, Together, and Baseten with 1M context
  seed: 42

gateway:
  type: directProviders
  providers:
    - id: fireworks
      slug: fireworks
      endpoints: https://api.fireworks.ai/inference/v1
      apikeyENV: FIREWORKS_API_KEY
      model: accounts/fireworks/models/glm-5p3-flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03
    - id: together
      slug: together
      endpoints: https://api.together.ai/v1
      apikeyENV: TOGETHER_API_KEY
      model: zai-org/GLM-5.3-Flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03
    - id: baseten
      slug: baseten
      endpoints: https://inference.baseten.co/v1
      apikeyENV: BASETEN_API_KEY
      model: zai-org/GLM-5.3-Flash
      pricing:
        inputUsdPerMillion: 0.15
        outputUsdPerMillion: 0.50
        cachedInputUsdPerMillion: 0.03

models:
  - id: glm-5-3-flash
    openrouterModel: z-ai/glm-5.3-flash
    tokenizer: THUDM/glm-4-9b-chat
    tokenizerTrustRemoteCode: true
    contextLength: 1048575

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: synthetic
      inputTokens: 8192
      outputTokens: 1024
      datasetEntries: 12
    load:
      mode: concurrency
      values: [1]
    durationSeconds: 300
    warmup:
      requestCount: 0
    useServerTokenCount: true

  correctness:
    enabled: true
    generation:
      temperature: 0
      maxTokens: 1024
    tasks:
      - name: gsm8k
        runner: lm-eval
        limit: 100

  pricing:
    enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 300
      maxP95TtftMs: 5000
      minSuccessRate: 0.99
