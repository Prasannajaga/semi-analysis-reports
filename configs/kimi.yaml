schemaVersion: "1.0"
benchmark:
  name: kimi-k3-provider-benchmark
  description: Benchmark Kimi K3 across Fireworks and Together with 1M context
  seed: 42

# gateway:
#   type: openrouter
#   baseUrl: https://openrouter.ai/api/v1
#   apiKeyEnv: OPENROUTER_API_KEY
#   retries:
#     maxRetries: 3
#     retryDelaySeconds: 2.0
#     backoffFactor: 2.0
#   routing:
#     allowFallbacks: false
#     requireParameters: true
#   providers: 
#     - id: fireworks
#       slug: fireworks
#     - id: together
#       slug: together
#     - id: baseten
#       slug: baseten 

gateway:
  type: directProviders 
  providers:
    - id: fireworks
      slug: fireworks
      endpoints: https://api.fireworks.ai/inference/v1
      apikeyENV: FIREWORKS_API_KEY
    - id: together
      slug: together
      endpoints: https://api.together.ai/v1
      apikeyENV: TOGETHER_API_KEY
    - id: baseten
      slug: baseten
      endpoints: https://inference.baseten.co/v1
      apikeyENV: BASETEN_API_KEY
    
models:
  - id: kimi-k3
    openrouterModel: moonshotai/kimi-k3
    tokenizer: moonshotai/Kimi-K3
    tokenizerTrustRemoteCode: true
    contextLength: 1048576

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: synthetic
      inputTokens: 8192
      outputTokens: 1024
      datasetEntries: 64
    load:
      mode: concurrency
      values: [1]
    durationSeconds: 300
    warmup:
      requestCount: 1
    useServerTokenCount: true

  correctness:
    enabled: false
    generation:
      temperature: 0
      maxTokens: 8192
    tasks:
      - name: gsm8k
        runner: lm-eval

  pricing:
    enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 300
      maxP95TtftMs: 5000
      minSuccessRate: 0.99
