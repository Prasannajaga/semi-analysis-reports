schemaVersion: "1.0" 
benchmark:
  name: qwen3-provider-comparison
  description: Compare Qwen3 32B across three OpenRouter providers
  seed: 20260903

gateway:
  type: openrouter
  baseUrl: https://openrouter.ai/api/v1
  apiKeyEnv: OPENROUTER_API_KEY
  routing:
    allowFallbacks: false
    requireParameters: true

providers:
  - id: deepinfra
    openrouterSlug: deepinfra 

models:
  - id: qwen3-32b
    openrouterModel: qwen/qwen3-32b
    tokenizer: Qwen/Qwen3-32B
    contextLength: 40960 

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: agentx
      dataset:
        name: semianalysis_cc_traces_weka_062126
        maxContextLength: 32768
    load:
      mode: concurrency
      values: [4, 8, 16, 32]
    durationSeconds: 1800
    warmup:
      requestCount: 10
    useServerTokenCount: true

  correctness:
    enabled: true
    generation:
      temperature: 0
      maxTokens: 8192
    tasks: 
      - name: gsm8k
        runner: lm-eval 

  pricing:
   enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 300
      maxP95TtftMs: 5000
      minSuccessRate: 0.99