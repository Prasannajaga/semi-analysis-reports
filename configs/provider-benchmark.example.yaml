DEBUG: true
schemaVersion: "1.0" 
benchmark:
  name: qwen3-provider-comparison
  description: Compare Qwen3 32B across three OpenRouter providers
  seed: 20260903

gateway:
  type: openrouter
  baseUrl: https://openrouter.ai/api/v1
  apiKeyEnv: OPENROUTER_API_KEY
  routing:
    allowFallbacks: false
    requireParameters: true

providers:
  - id: together
    openrouterSlug: together

models:
  - id: kimi-k3
    openrouterModel: moonshotai/kimi-k3
    tokenizer: moonshotai/Kimi-K3 
    tokenizerTrustRemoteCode: true
    contextLength: 1048576

phases:
  performance:
    enabled: true
    runner: aiperf
    workload:
      type: synthetic
      inputTokens: 8192
      outputTokens: 1024
      datasetEntries: 64
    load:
      mode: concurrency
      values: [1]
    durationSeconds: 300
    warmup:
      requestCount: 1
    useServerTokenCount: true

  correctness:
    enabled: true
    generation:
      temperature: 0
      maxTokens: 8192
    tasks: 
      - name: gsm8k
        runner: lm-eval 
        limit: 500 

  pricing:
    enabled: true

  reliability:
    enabled: true
    collect:
      httpErrors: true
      timeouts: true
      connectionErrors: true
      parseErrors: true
      contextOverflow: true
    slo:
      requestTimeoutSeconds: 300
      maxP95TtftMs: 5000
      minSuccessRate: 0.99
