[project]
name = "openrouter-provider-benchmark"
version = "0.1.0"
description = "Reproducible OpenRouter provider benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiperf==0.12.0",
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.1.1,<2",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
bfcl = [
    "bfcl-eval==2026.3.23",
]
lm-eval = [
    "lm-eval[api]==0.4.13",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1,<2",
    "pytest>=8.4.2,<10",
    "pytest-asyncio>=1.2.0,<2",
    "pytest-cov>=7.0.0,<8",
    "respx>=0.22.0,<1",
    "ruff>=0.12.12,<1",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: opt-in test that may make a paid OpenRouter request",
]

[tool.coverage.run]
branch = true
source = ["benchmark_tool"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["benchmark.py", "analysis.py", "view.py", "benchmark_tool"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
